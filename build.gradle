plugins {
    id 'fabric-loom' version '1.13.6'
}

// Build for a Minecraft version with -Pmc=<version>, see versions/
def mc = project.findProperty('mc') ?: project.default_mc
def target = new Properties()
file("versions/${mc}.properties").withInputStream { target.load(it) }

group = 'com.roundtrees'
version = "${target.jar_name}_${project.mod_version}"

repositories {
    mavenCentral()
    maven { url = 'https://maven.fabricmc.net/' }
}

dependencies {
    minecraft "com.mojang:minecraft:${target.minecraft_version}"
    mappings "net.fabricmc:yarn:${target.yarn_mappings}:v2"
    modImplementation "net.fabricmc:fabric-loader:${project.loader_version}"
}

tasks.withType(ProcessResources).configureEach {
    duplicatesStrategy = DuplicatesStrategy.EXCLUDE
    def props = [version: project.mod_version, minecraft_range: target.minecraft_range, java_version: target.java_version]
    inputs.properties props
    filesMatching(['fabric.mod.json', 'mixins.roundtreescompanion.json']) {
        expand props
    }
}

loom {
    splitEnvironmentSourceSets()
    sourceSets {
        main {
            java.srcDirs = []
            resources.srcDirs = ["src/main/resources"]
        }
        client {
            java.srcDirs = ["src/client/java", "src/versions/${mc}/java"]
            resources.srcDirs = ["src/client/resources"]
        }
    }
}

java {
    toolchain.languageVersion.set(JavaLanguageVersion.of(target.java_version as int))
}
